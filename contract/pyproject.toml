[project]
name = "vigilans-contract"
version = "0.4.0"
description = "The Vigilans wire contracts (observation.v1, picture.v0, library.v1, scenario.v2): JSON Schemas and a thin validator"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.23",
  # Without it, jsonschema silently skips `format: date-time` and "2026-02-30T00:00:00Z"
  # passes. A test asserts the check is live.
  "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilans_contract"]

# The schemas are maintained in ../schemas beside this package, where non-Python
# consumers read them; the wheel carries a copy.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "vigilans_contract/schemas"
