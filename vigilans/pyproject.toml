[project]
name = "vigilans"
version = "2.0.0.dev0"
description = "RF observations from many sources, fused into hedged, explained entities and groups, published to Videns and TAK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "vigilans-contract",
  "numpy>=2",
  "pyproj>=3.6",
  "pyyaml>=6",
  "aiohttp>=3.10",
]

[project.scripts]
vigilans = "vigilans.cli:main"

[tool.uv.sources]
vigilans-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilans"]
